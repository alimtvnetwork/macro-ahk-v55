# ──────────────────────────────────────────────────────────────
# Marco Extension — Tag and Release (server-side tag creation + release)
#
# The sandbox/dev environment cannot create or push git tags, which
# left every release ceremony without a `v*` tag and therefore without
# a Release Build run. This workflow creates the tag server-side with
# GITHUB_TOKEN and then CALLS `release.yml` in the same run.
#
# Why the call is mandatory: a push made with the built-in GITHUB_TOKEN
# does not emit a `push` event (GitHub suppresses it to prevent
# recursive runs). So `release.yml`'s `push: tags: v*` trigger can never
# fire from the tag created here. Relying on it produced the exact
# "tag exists, release page empty" symptom. `workflow_call` is the fix.
#
# Usage: Actions > Tag and Release > Run workflow > version = 5.21.0
# ──────────────────────────────────────────────────────────────

name: Tag and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, without the leading v (for example 5.21.0)"
        required: true
        type: string
      ref:
        description: "Commit-ish to tag. Defaults to the branch this run targets."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tag-and-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create v${{ inputs.version }} tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate version input
        run: |
          VER="${{ inputs.version }}"
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VER'. Expected MAJOR.MINOR.PATCH without a leading v."
            exit 1
          fi
          echo "TAG_NAME=v$VER" >> "$GITHUB_ENV"

      - name: Create or safely reuse tag
        id: tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
            TAG_COMMIT=$(git rev-list -n 1 "$TAG_NAME")
            if [ -n "${{ inputs.ref }}" ]; then
              REQUESTED_COMMIT=$(git rev-parse HEAD)
              if [ "$TAG_COMMIT" != "$REQUESTED_COMMIT" ]; then
                echo "::error::Existing tag $TAG_NAME points to $TAG_COMMIT, not requested commit $REQUESTED_COMMIT. Refusing to move an immutable release tag."
                exit 1
              fi
            fi
            echo "Reusing existing immutable tag $TAG_NAME at $TAG_COMMIT."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed $TAG_NAME at $(git rev-parse HEAD)."
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Validated **$TAG_NAME**. The \`release\` job below calls \`release.yml\` directly for this tag." >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────
  # Build and publish the GitHub Release for the tag just created.
  # Called directly, never relying on a tag-push event.
  # ──────────────────────────────────────────────────────────────
  release:
    name: Release Build
    needs: create-tag
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      version: ${{ needs.create-tag.outputs.tag }}