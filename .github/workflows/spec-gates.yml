name: spec-gates

on:
  push:
  pull_request:

jobs:
  perf-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        run: npm ci || npm install
      - name: Perf budget check
        run: node scripts/spec/check-perf-budget.mjs
        continue-on-error: false

  # Fails CI if a new hardcoded owner/repo literal for
  # macro-ahk-v{N} sneaks into tracked sources. See
  # .lovable/memory/features/release-pipeline-repo-url-agnostic.md.
  verify-no-hardcoded-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded owner/repo literals
        run: |
          set -euo pipefail
          # Allowed to contain historical literals: RCA docs, spec examples,
          # the changelog (past release notes), memory files documenting the
          # rule itself, and the resolver/sync scripts' own regexes.
          matches=$(grep -RIn -E '(alimtvnetwork|aukgit)/macro-ahk-v[0-9]+' . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.lovable \
            --exclude-dir=spec \
            --exclude-dir=docs \
            --exclude=changelog.md \
            --exclude=readme.md \
            --exclude=resolve-repo-slug.mjs \
            --exclude=sync-repo-slug.mjs \
            --exclude='*.test.mjs' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Hardcoded owner/repo literals found. Use resolveRepoSlug() or env vars instead."
            echo "$matches"
            exit 1
          fi
          echo "OK: no hardcoded owner/repo literals in tracked sources."

  spec-xref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-reference linter
        run: node scripts/spec/lint-cross-refs.mjs

  spec-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate INDEX.json
        run: node scripts/spec/build-index.mjs
      - name: Verify INDEX.json committed and current
        run: |
          git diff --exit-code spec/21-app/05-prompts/INDEX.json \
            || (echo "INDEX.json out of date — run scripts/spec/build-index.mjs" && exit 1)

  runbook-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Top-15 reason codes have runbooks
        run: node scripts/spec/runbook-smoke.mjs

  tooltip-dict-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tooltip dict in sync
        run: node scripts/spec/tooltip-dict-gate.mjs

  smoke-rescore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Blind-AI smoke rescore
        run: node scripts/spec/smoke-rescore.mjs
